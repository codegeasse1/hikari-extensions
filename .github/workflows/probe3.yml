name: Probe3
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Playwright
        run: |
          mkdir -p probes
          npm init -y >/dev/null
          npm i playwright@1.45.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1 || npx playwright install chromium
      - name: Probe justanime
        run: node probe.js
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: probes
          path: probes/
