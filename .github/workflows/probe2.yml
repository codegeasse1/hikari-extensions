name: Probe2
on:
  push:
    branches: [ main ]
    paths: [".github/workflows/probe2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello probe2" && curl -sS "https://core.justanime.to/api/home" -H "Origin: https://justanime.to" | head -c 500 > probes-home.txt && wc -c probes-home.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probes2
          path: probes-home.txt
